<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bridge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#CC2936"/>
      <stop offset="1" stop-color="#D97757"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- ===== left: stack of papers (Zotero side) ===== -->
  <g transform="translate(90 320)">
    <!-- back sheet -->
    <g transform="rotate(-12 110 150)">
      <rect x="0" y="0" width="220" height="300" rx="10" fill="#fff" stroke="#E6E6E6" stroke-width="3" filter="url(#soft)"/>
    </g>
    <!-- middle sheet -->
    <g transform="rotate(-6 110 150) translate(14 10)">
      <rect x="0" y="0" width="220" height="300" rx="10" fill="#fff" stroke="#E6E6E6" stroke-width="3" filter="url(#soft)"/>
    </g>
    <!-- front sheet -->
    <g transform="translate(30 20)">
      <rect x="0" y="0" width="220" height="300" rx="10" fill="#fff" stroke="#E6E6E6" stroke-width="3" filter="url(#soft)"/>
      <!-- red header bar: Zotero color -->
      <rect x="0" y="0" width="220" height="34" rx="10" fill="#CC2936"/>
      <rect x="0" y="20" width="220" height="14" fill="#CC2936"/>
      <!-- title lines -->
      <rect x="24" y="58" width="150" height="14" rx="7" fill="#333"/>
      <rect x="24" y="80" width="100" height="10" rx="5" fill="#999"/>
      <!-- body lines -->
      <g fill="#D8D8D8">
        <rect x="24" y="112" width="172" height="8" rx="4"/>
        <rect x="24" y="130" width="172" height="8" rx="4"/>
        <rect x="24" y="148" width="130" height="8" rx="4"/>
        <rect x="24" y="178" width="172" height="8" rx="4"/>
        <rect x="24" y="196" width="172" height="8" rx="4"/>
        <rect x="24" y="214" width="150" height="8" rx="4"/>
      </g>
      <!-- tiny chart -->
      <g fill="#CC2936" opacity="0.85">
        <rect x="120" y="258" width="14" height="24"/>
        <rect x="140" y="246" width="14" height="36"/>
        <rect x="160" y="234" width="14" height="48"/>
        <rect x="180" y="252" width="14" height="30"/>
      </g>
      <!-- highlight (reading annotation) -->
      <rect x="24" y="128" width="172" height="12" rx="4" fill="#FFD36B" opacity="0.6"/>
    </g>
  </g>

  <!-- ===== bridge arc ===== -->
  <path d="M 300 300 C 390 120, 570 120, 650 395"
        fill="none" stroke="url(#bridge)" stroke-width="20" stroke-linecap="round"/>
  <!-- travelling dots on the arc: papers -> insight -->
  <g stroke="#fff" stroke-width="4">
    <circle cx="363.3" cy="214.4" r="12" fill="#CC2936"/>
    <circle cx="439.0" cy="176.5" r="12" fill="#D04A45"/>
    <circle cx="518.2" cy="190.9" r="12" fill="#D66150"/>
    <circle cx="591.5" cy="262.2" r="12" fill="#D97757"/>
  </g>

  <!-- ===== right: Claude-style spark ===== -->
  <g transform="translate(650 480)">
    <!-- outer glow -->
    <circle cx="0" cy="0" r="92" fill="#D97757" opacity="0.10"/>
    <circle cx="0" cy="0" r="62" fill="#D97757" opacity="0.14"/>
    <!-- main 4-point spark -->
    <path d="M 0 -70 C 8 -22, 22 -8, 70 0 C 22 8, 8 22, 0 70 C -8 22, -22 8, -70 0 C -22 -8, -8 -22, 0 -70 Z"
          fill="#D97757"/>
    <!-- small secondary sparks -->
    <path d="M 62 -62 C 65 -50, 70 -45, 82 -42 C 70 -39, 65 -34, 62 -22 C 59 -34, 54 -39, 42 -42 C 54 -45, 59 -50, 62 -62 Z"
          fill="#D97757" opacity="0.8"/>
    <path d="M -60 50 C -58 58, -55 61, -47 63 C -55 65, -58 68, -60 76 C -62 68, -65 65, -73 63 C -65 61, -62 58, -60 50 Z"
          fill="#D97757" opacity="0.6"/>
  </g>

  <!-- ===== caption ===== -->
  <text x="400" y="712" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#2B2B2B">
    Zotero Reading Bridge
  </text>
  <text x="400" y="752" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#777" letter-spacing="2">
    FROM PAPERS TO INSIGHT
  </text>
</svg>
